<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>بطاقات القلب المطمئنّ — كتابي المنير</title>
<style>
@font-face{font-family:'AlAwwal';src:url('assets/fonts/AlAwwal-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'AlAwwal';src:url('assets/fonts/AlAwwal-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Saudi';src:url('assets/fonts/Saudi-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
:root{--fd:'AlAwwal','Noto Naskh Arabic',serif;--fb:'Saudi','Noto Naskh Arabic',Tahoma,sans-serif;--t1:#1b5e34;--elm:#2D7A4B;--gold:#C79A3B;--cream:#F6F1E6;--muted:#6C776F}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:#e9efe8;padding:22px;color:#26332c;line-height:1.6}
.head{max-width:1000px;margin:0 auto 16px;text-align:center}
.head h1{font-family:var(--fd);color:var(--t1);font-size:23px}
.head p{color:var(--muted);font-size:13px;margin-top:5px}
.grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.dcard{background:var(--cream);border:2.5px solid var(--elm);border-radius:20px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 8px 20px rgba(20,50,35,.12);break-inside:avoid;min-height:150px;justify-content:center;position:relative}
.dcard .dc-brand{display:flex;align-items:center;gap:7px;position:absolute;top:12px;inset-inline-start:14px}
.dcard .dc-brand img{height:26px}
.dcard .dc-brand b{font-family:var(--fd);color:var(--t1);font-size:11px}
.dcard .dc-top{font-family:var(--fd);color:var(--gold);font-size:14px;margin-top:14px}
.dcard .dc-text{font-family:var(--fd);font-weight:700;color:var(--t1);font-size:38px;line-height:1.15}
.printbtn{display:block;margin:22px auto 6px;background:var(--elm);color:#fff;border:0;border-radius:999px;padding:11px 28px;font-family:var(--fb);font-weight:700;font-size:14px;cursor:pointer}
@media print{@page{size:A4 portrait;margin:10mm}body{background:#fff;padding:0}.head,.printbtn{display:none}.grid{max-width:100%;gap:8mm}.dcard{box-shadow:none;min-height:80mm;break-inside:avoid}.dcard .dc-text{font-size:44px}}
</style>
</head>
<body>
<div class="head"><h1>بطاقات القلب المطمئنّ</h1><p>كتابي المنير · سورة الفجر (٢٧–٣٠) · اطبعيها وغلّفيها للنشاط</p></div>
<div class="grid">
  <div class="dcard"><div class="dc-brand"><img src="brand/logo-ghars.webp" alt="غرس"/><b>كتابي المنير</b></div><span class="dc-top">قلبي يطمئنّ حين…</span><span class="dc-text">أرضى بالله</span></div>
  <div class="dcard"><div class="dc-brand"><img src="brand/logo-ghars.webp" alt="غرس"/><b>كتابي المنير</b></div><span class="dc-top">قلبي يطمئنّ حين…</span><span class="dc-text">أشكرُ عند النعمة</span></div>
  <div class="dcard"><div class="dc-brand"><img src="brand/logo-ghars.webp" alt="غرس"/><b>كتابي المنير</b></div><span class="dc-top">قلبي يطمئنّ حين…</span><span class="dc-text">أصبرُ عند البلاء</span></div>
  <div class="dcard"><div class="dc-brand"><img src="brand/logo-ghars.webp" alt="غرس"/><b>كتابي المنير</b></div><span class="dc-top">قلبي يطمئنّ حين…</span><span class="dc-text">أرجو الجنّة</span></div>
</div>
<button class="printbtn" onclick="window.print()">🖨️ طباعة البطاقات</button>
</body>
</html>
