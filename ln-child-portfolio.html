<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ملف أعمال الطفل — وحدة الليل والنهار · غرس القيم</title>
<style>
@font-face{font-family:'AlAwwal';src:url('assets/fonts/AlAwwal-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'AlAwwal';src:url('assets/fonts/AlAwwal-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Saudi';src:url('assets/fonts/Saudi-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Saudi';src:url('assets/fonts/Saudi-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{--fd:'AlAwwal','Noto Naskh Arabic',serif;--fb:'Saudi','Noto Naskh Arabic',Tahoma,sans-serif;
  --t1:#1b2555;--t2:#33409a;--gold:#D9A93E;--gold-d:#9c7a2a;--ink:#232838;--muted:#6d7288;--line:#ded9c6;--cream:#F7F5EC;--card:#FFFEF9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);color:var(--ink);line-height:1.7;font-size:15px;background:#c7cad9;padding:18px}
.cover{max-width:800px;margin:0 auto;background:var(--cream);border-radius:18px;overflow:hidden;box-shadow:0 12px 34px rgba(20,30,80,.18);border:1px solid #c3c3d0}
h1,h2,h3,.badge,.plate .val{font-family:var(--fd)}
.top{background:linear-gradient(135deg,var(--t1),var(--t2));color:#fff;padding:16px 26px;display:flex;align-items:center;gap:13px}
.top img{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.top .club{font-family:var(--fd);font-size:17px;font-weight:700;line-height:1.2}
.top .club small{display:block;font-family:var(--fb);font-size:11.5px;font-weight:400;color:#c8ccec;letter-spacing:.4px}
.top .doc{margin-inline-start:auto;background:var(--gold);color:#3a2a06;font-family:var(--fd);font-weight:700;font-size:14px;border-radius:999px;padding:6px 16px}
.hero{position:relative;text-align:center;padding:22px 22px 8px}
.hero .unit-k{font-size:12.5px;letter-spacing:3px;color:var(--gold-d);font-weight:700}
.hero h1{font-size:34px;color:var(--t1);margin:2px 0 4px;line-height:1.15}
.hero p{font-size:13px;color:var(--muted);max-width:520px;margin:0 auto}
.scene{width:100%;max-width:470px;height:auto;aspect-ratio:2/1;object-fit:cover;display:block;margin:12px auto 2px;border-radius:14px;box-shadow:0 16px 34px -22px rgba(31,74,57,.42);border:1px solid rgba(31,74,57,.10)}
.body{padding:6px 26px 26px}
.plate{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:16px 18px;margin-top:8px;box-shadow:0 4px 14px rgba(217,169,62,.14)}
.plate .nm{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.plate .nm .lab{font-family:var(--fd);font-weight:700;color:var(--t1);font-size:17px;white-space:nowrap}
.plate .nm .line{flex:1;min-width:200px;border-bottom:2.5px dotted var(--line);height:30px}
.plate .id{display:flex;align-items:center;gap:9px}
.plate .id .lab{font-family:var(--fd);font-weight:700;color:var(--gold-d);font-size:14px}
.plate .id .box{display:flex;gap:5px}
.plate .id .box i{width:30px;height:38px;border:2px solid var(--t2);border-radius:8px;background:#fff;display:block}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:11px;margin-top:12px}
.mcell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:13.5px}
.mcell b{font-family:var(--fd);color:var(--t1);display:block;font-size:13px;margin-bottom:2px}
.mcell .fill{border-bottom:2px dotted var(--line);min-height:22px}
.trk{margin-top:16px}
.trk h2{font-family:var(--fd);font-size:16px;color:var(--t1);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.trk h2::before{content:"";width:16px;height:16px;border-radius:4px;background:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);border-radius:12px;overflow:hidden}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:right}
th{background:var(--t1);color:#fff;font-family:var(--fd);font-weight:700;font-size:13px}
td .chk{width:20px;height:20px;border:2px solid var(--t2);border-radius:6px;display:inline-block}
tbody tr:nth-child(even){background:#f4f3ea}
.ctr{text-align:center}
.note{margin-top:14px;background:#eef0f8;border:1px solid #d3d7ee;border-inline-start:5px solid var(--t2);border-radius:12px;padding:11px 14px;font-size:12.8px;color:#2b3050;line-height:1.85}
.foot{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px;border-top:1px solid var(--line);padding-top:12px;text-align:center}
.foot img{width:78px;height:auto}
.foot span{font-size:11px;color:var(--muted)}
.printbtn{display:block;margin:16px auto 0;background:var(--t1);color:#fff;border:0;border-radius:999px;padding:9px 24px;font-family:var(--fb);font-weight:700;font-size:14px;cursor:pointer}
@media print{body{background:#fff;padding:0}.cover{box-shadow:none;border:0;border-radius:0;max-width:100%}.printbtn{display:none}}
</style>
<style id="ghars-box-identity">
.dua,.central{background:#fff!important;color:#1E2E29!important;border:1px solid #EAE2D3!important;box-shadow:0 12px 26px rgba(20,40,35,.06)!important;border-radius:14px!important}
.dua .copy-btn,.central .copy-btn{background:#EEF4F1!important;border:1px solid #EAE2D3!important;color:#1E5631!important}
.quick-sheet,.kitabi-hijri-tool{background:#fff!important;border:1px solid #EAE2D3!important;border-radius:14px!important}
.kitabi-hijri-prompt{background:#fff!important}
.taq h3{color:#1E5631}
.cardblue h3,.cardblue h4,.cardblue .lbl{color:#1E5631}
.cardgold h3,.cardgold h4{color:#B0842C}
.cardgold .lbl{color:#B0842C;border-color:#EABF7A}
.cardpurple h3,.cardpurple h4,.cardpurple .lbl{color:#7A5CC0;border-color:#C9B8EA}
.flow-card.law .lbl,.flow-card.law h3,.flow-card.law h4{color:#B0842C}
.flow-card.belief .lbl,.flow-card.sig .lbl,.flow-card.rev .lbl{color:#1E5631}
.taq .gi,.cardblue .gi{--ic-t:#1E5631}
.cardgold .gi,.flow-card.law .gi{--ic-t:#B0842C}
.cardpurple .gi{--ic-t:#7A5CC0}
.story .h,.adab .h,.corner .h{background:#fff!important;border-bottom:1px solid #EAE2D3!important}
.adab .h,.adab .h h4,.corner .h,.corner .h h4{color:#1E5631!important}
.story .h,.story .h h4{color:#B0842C!important}
.qs-head,.actbar,.kitabi-hijri-top{background:#fff!important;border-bottom:1px solid #EAE2D3!important}
.qs-head,.qs-head *{color:#1E5631!important}
.actbar,.actbar *{color:#B0842C!important}
.actful .imgwrap{background:#F7F4ED!important}
.actful .miniblock>b{background:transparent!important}
h3,h4{border-bottom:2px solid #E7C98B!important;padding-bottom:7px!important;margin-bottom:11px!important}
.cover h3,.cover h4,.wa h3,.wa h4,.wa-head *,.central h4:only-child{border-bottom:0!important;padding-bottom:0!important}
.h,.story .h,.adab .h,.corner .h,.side-title,.qs-head,.actbar,.par .h,.refblock .h{border-bottom:2px solid #E7C98B!important;padding-bottom:7px!important;margin-bottom:9px!important}
.wa-head,.wa-head *{border-bottom:0!important;padding-bottom:0!important}
b.k{background:rgba(30,86,49,.10)!important;padding:2px 10px!important;border-radius:7px!important}
.qa .a{background:rgba(30,86,49,.10)!important;color:#15502F!important;padding:1px 9px!important;border-radius:6px!important}
.central>b{color:#1E5631!important}
.actgrid .t{display:inline-block!important;padding:3px 11px!important;border-radius:8px!important;margin-bottom:7px!important;font-weight:700!important;border-bottom:0!important}
.actgrid>div:nth-child(1) .t{background:rgba(30,86,49,.12)!important;color:#1E5631!important}
.actgrid>div:nth-child(2) .t{background:rgba(176,132,44,.17)!important;color:#8A5A12!important}
.actgrid>div:nth-child(3) .t{background:rgba(14,110,107,.14)!important;color:#0E6E6B!important}
.actgrid>div:nth-child(4) .t{background:rgba(122,92,192,.14)!important;color:#5A3F9A!important}
.dua{background:linear-gradient(150deg,#0F5747,#123f27)!important;border:1px solid rgba(214,154,51,.5)!important;text-align:center!important;box-shadow:0 16px 34px rgba(15,45,32,.28)!important;padding:22px!important;border-radius:16px!important}
.dua .seal{color:#D69A33;font-size:20px;margin-bottom:7px;letter-spacing:2px}
.dua .l{color:#E7C98B!important;font-family:var(--fd)!important;border-bottom:0!important;letter-spacing:1px}
.dua .x{font-family:'Amiri','Noto Naskh Arabic',serif!important;font-size:20px!important;line-height:2!important;color:#F6EFDD!important}
.hadith{background:#fff!important;box-shadow:none!important;font-family:'Amiri','Noto Naskh Arabic',serif!important;border:1px solid #EAE2D3!important}
.hadith::before{color:#8A6410!important;background:transparent!important;padding:0!important;font-family:var(--fd)!important;display:block;font-size:12px;font-weight:700;margin-bottom:6px;letter-spacing:.5px}
.hadith .ref{font-family:var(--fb)!important}
.acards-lead{background:#fff!important;border:1px solid #EAE2D3!important}
</style>
<style id="ghars-aux-identity">
/* Ghars identity for auxiliary sections (manzuma/arkan/portfolio/day) - ASCII only */
/* teacher notes -> white, ochre inline label */
.note{background:#fff!important;border:1px solid #EAE2D3!important;border-inline-start:1px solid #EAE2D3!important;color:#4b463d!important}
.note strong,.note b{color:#B07C22!important}
/* arkan: whiten tinted group/option boxes, drop colored top bars */
.lg{background:#fff!important;border:1px solid #EAE2D3!important;border-top:1px solid #EAE2D3!important}
.opt{background:#fff!important;border:1px solid #EAE2D3!important}
.opt.a{border-top:1px solid #EAE2D3!important}
.opt.b{border-top:1px solid #EAE2D3!important}
.opt .mean{background:#fff!important;border:1px solid #EAE2D3!important;color:#3a2f1a!important}
/* keep the a/b tag colored: it carries the corner distinction (label, not box fill) */
/* lesson header: replace gold side bar with clean start (title underline comes from box-identity h3/h4) */
.lesson-head{border-inline-start:0!important;padding-inline-start:0!important}

</head>
<body>
<div class="cover">

  <div class="top">
    <img src="brand/logo-ghars.webp" alt="شعار نادي غرس القيم"/>
    <div class="club">نادي غرس القيم<small>لضيافة الأطفال · المرحلة التمهيدية</small></div>
    <div class="doc">ملف أعمال الطفل</div>
  </div>

  <div class="hero">
    <div class="unit-k">الفصل الدراسي الأول</div>
    <h1>وحدة الليل والنهار</h1>
    <p>مجموعةُ أعمال الطفل وأوراقه خلال الوحدة — تُجمع هنا لمتابعة تقدّمه، وتُرسل لوليّ الأمر في ختام الوحدة.</p>
    <!-- مشهد الليل والنهار (شمس · هلال · نجوم — بلا ذوات أرواح) -->
    <img class="scene" src="units-art/unit-layl-nahar.jpg?v=13" alt="وحدة الليل والنهار" loading="lazy">
  </div>

  <div class="body">
    <div class="plate">
      <div class="nm"><span class="lab">اسم الطفل</span><span class="line"></span>
        <span class="id"><span class="lab">الرقم التعريفي (ID)</span><span class="box"><i></i><i></i><i></i><i></i></span></span>
      </div>
    </div>
    <div class="meta">
      <div class="mcell"><b>الفصل / المجموعة</b><div class="fill"></div></div>
      <div class="mcell"><b>المعلمة المشرفة</b><div class="fill"></div></div>
      <div class="mcell"><b>الفصل الدراسي</b><div class="fill"></div></div>
      <div class="mcell"><b>التاريخ (من — إلى)</b><div class="fill"></div></div>
    </div>

    <div class="trk">
      <h2>متابعة أوراق عمل الوحدة</h2>
      <table>
        <thead><tr><th style="width:34%">المركز / المادة</th><th>ورقة العمل</th><th class="ctr" style="width:14%">أنجزها ✓</th><th style="width:22%">ملاحظة المعلمة</th></tr></thead>
        <tbody>
          <tr><td>لساني عربي</td><td>الحركات الثلاث (فتحة · كسرة · ضمة)</td><td class="ctr"><span class="chk"></span></td><td></td></tr>
          <tr><td>لساني عربي</td><td>تهجئة كلمات بالحركات</td><td class="ctr"><span class="chk"></span></td><td></td></tr>
          <tr><td>مهاراتي</td><td>مراجعة الأعداد ١٠ · ١١ · ١٢</td><td class="ctr"><span class="chk"></span></td><td></td></tr>
          <tr><td>كتابي المنير</td><td>&nbsp;</td><td class="ctr"><span class="chk"></span></td><td></td></tr>
          <tr><td>علّمني ربي</td><td>&nbsp;</td><td class="ctr"><span class="chk"></span></td><td></td></tr>
          <tr><td>&nbsp;</td><td>&nbsp;</td><td class="ctr"><span class="chk"></span></td><td></td></tr>
        </tbody>
      </table>
    </div>

    <div class="note"><strong>لوليّ الأمر:</strong> هذا الملفّ يجمع أعمال طفلكم وأوراقه خلال وحدة الليل والنهار، ليطمئنّ الجميعُ على تقدّمه وما أنجزه. نشكر الله على نعمة تعاقب الليل والنهار والعلم، ونسأله أن يبارك في أبنائنا. برجاء الاطّلاع عليه وإعادته مع الطفل.</div>

    <div class="foot">
      <a href="https://www.hadarah-consulting.com/" target="_blank" rel="noopener"><img src="brand/hadarah-logo.png" alt="شركة حضارة للاستشارات التربوية والتعليمية"/></a>
      <span>إعداد وتطوير وإخراج دليل المعلمة — شركة حضارة للاستشارات التربوية والتعليمية</span>
    </div>
    <button class="printbtn" onclick="window.print()"><i class="gi gi-dark" data-i="طباعة / PDF" data-size="18"></i> طباعة الغلاف</button>
  </div>
</div>
<script src="brand/guide-icons.js?v=3"></script>
</body>
</html>
