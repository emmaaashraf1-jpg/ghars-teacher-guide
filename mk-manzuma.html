<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>منظومة الوحدة · وحدة المسكن · غرس القيم</title>
<style>
@font-face{font-family:'AlAwwal';src:url('assets/fonts/AlAwwal-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'AlAwwal';src:url('assets/fonts/AlAwwal-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Saudi';src:url('assets/fonts/Saudi-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Saudi';src:url('assets/fonts/Saudi-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{
  --fd:'AlAwwal','Noto Naskh Arabic',serif; --fb:'Saudi','Noto Naskh Arabic',Tahoma,sans-serif;
  --v1:#4a2a7a; --v2:#6d4aa7; --v3:#8a67c4; --v-soft:#f3eefb; --v-soft2:#faf7ff;
  --gold:#C79A3B; --gold2:#C8A200;
  --ink:#2a2340; --muted:#6b6480; --line:#e9e2f2; --card:#fff;
  --shadow:0 10px 30px rgba(60,30,110,.10); --shadow-sm:0 4px 14px rgba(60,30,110,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);color:var(--ink);line-height:1.95;font-size:16px;
  background:radial-gradient(1100px 480px at 85% -10%,#efe7fb 0,transparent 58%),linear-gradient(#fbf8f2,#f4eef8);
  padding:22px 16px 60px}
.wrap{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
b,strong{font-weight:700}
h1,h2,h3,.badge,.sec-head h2,.bayt{font-family:var(--fd)}

/* ===== الغلاف ===== */
.cover{position:relative;overflow:hidden;border-radius:24px;color:#fff;box-shadow:var(--shadow);min-height:180px;background:url('units-art/unit-maskan.jpg?v=13') center/cover}
.cover-bg{position:absolute;inset:0;z-index:0;opacity:.55;
  background:linear-gradient(135deg,var(--v1) 0%,var(--v2) 55%,#5a3a95 100%)}
.cover-bg::after{content:"";position:absolute;inset:0;opacity:.16;
  background:radial-gradient(circle at 86% 20%,#fff 0 2px,transparent 3px) 0 0/30px 30px}
.cover-glow{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(700px 260px at 12% -10%,rgba(231,193,105,.35),transparent 60%)}
.cover-in{position:relative;z-index:2;padding:28px 30px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.cover-badge{flex:0 0 auto;width:78px;height:78px;border-radius:20px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.cover-badge svg{width:42px;height:42px;color:#ffe6a8}
.cover-txt{flex:1;min-width:240px}
.badge{display:inline-block;background:var(--gold);color:#3a2a06;border-radius:999px;padding:5px 15px;font-weight:700;font-size:13.5px;margin-bottom:11px}
.cover h1{font-size:31px;line-height:1.4;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.14)}
.cover h1 span{color:#ffe6a8}
.cover .sub{font-size:14.5px;color:#efe7fb;line-height:1.9;margin-top:9px;max-width:640px}

/* ===== شريط الاستخدام ===== */
.usebar{display:flex;align-items:center;gap:13px;background:var(--v-soft);border:1px solid var(--line);
  border-inline-start:5px solid var(--v2);border-radius:16px;padding:14px 18px;color:#3d2f5c;font-size:15px}
.usebar .ic{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:#fff;border:1px solid var(--line);color:var(--v2)}
.usebar .ic svg{width:22px;height:22px}
.usebar b{color:var(--v1)}

/* ===== بطاقة ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow-sm)}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-head .num{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--v2),var(--v1));box-shadow:0 5px 14px rgba(74,42,122,.28)}
.sec-head .num svg{width:20px;height:20px}
.sec-head h2{font-size:20px;color:var(--v1);font-weight:700}
.sec-head .rule{flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--gold),transparent)}

/* مشغّل الوسائط */
.media{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);
  background:#f6f2fb;aspect-ratio:16/9;box-shadow:inset 0 0 0 1px rgba(109,74,167,.06)}
.media iframe,.media video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.ph{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:26px;color:var(--muted)}
.ph .play{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--v2),var(--v1));box-shadow:0 10px 24px rgba(74,42,122,.32)}
.ph .play svg{width:32px;height:32px;margin-inline-start:4px}
.ph .t{font-size:14.5px;max-width:80%;line-height:1.95}
.audio{width:100%;margin-top:12px}
.hint{margin-top:12px;font-size:12.5px;color:var(--muted);text-align:center}

/* الأبيات */
.poem{display:flex;flex-direction:column;gap:2px}
.bayt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:13px 6px}
.bayt+.bayt{border-top:1px dashed var(--line)}
.bayt .sadr{text-align:end}.bayt .ajz{text-align:start}
.bayt .sadr,.bayt .ajz{font-size:22px;line-height:2;color:var(--ink)}
.bayt .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:0 0 auto;box-shadow:0 0 0 4px rgba(199,154,59,.14)}
.bayt.ph-line .sadr,.bayt.ph-line .ajz{color:#a99fc0;font-style:italic;font-size:16px;font-family:var(--fb)}
.poem-note{color:var(--muted);font-size:12.5px;text-align:center;margin-top:14px;font-style:italic}

.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:6px;padding-top:12px;border-top:1px dashed var(--line)}
@media(max-width:560px){
  .cover h1{font-size:25px}
  .bayt{grid-template-columns:1fr;gap:4px;text-align:center}
  .bayt .sadr,.bayt .ajz{text-align:center;font-size:19px}
  .bayt .dot{display:none}
}
</style>
<style id="ghars-box-identity">
.dua,.central{background:#fff!important;color:#1E2E29!important;border:1px solid #EAE2D3!important;box-shadow:0 12px 26px rgba(20,40,35,.06)!important;border-radius:14px!important}
.dua .copy-btn,.central .copy-btn{background:#EEF4F1!important;border:1px solid #EAE2D3!important;color:#1E5631!important}
.quick-sheet,.kitabi-hijri-tool{background:#fff!important;border:1px solid #EAE2D3!important;border-radius:14px!important}
.kitabi-hijri-prompt{background:#fff!important}
.taq h3{color:#1E5631}
.cardblue h3,.cardblue h4,.cardblue .lbl{color:#1E5631}
.cardgold h3,.cardgold h4{color:#B0842C}
.cardgold .lbl{color:#B0842C;border-color:#EABF7A}
.cardpurple h3,.cardpurple h4,.cardpurple .lbl{color:#7A5CC0;border-color:#C9B8EA}
.flow-card.law .lbl,.flow-card.law h3,.flow-card.law h4{color:#B0842C}
.flow-card.belief .lbl,.flow-card.sig .lbl,.flow-card.rev .lbl{color:#1E5631}
.taq .gi,.cardblue .gi{--ic-t:#1E5631}
.cardgold .gi,.flow-card.law .gi{--ic-t:#B0842C}

.story .h,.adab .h,.corner .h{background:#fff!important;border-bottom:1px solid #EAE2D3!important}
.adab .h,.adab .h h4,.corner .h,.corner .h h4{color:#1E5631!important}
.story .h,.story .h h4{color:#B0842C!important}
.qs-head,.actbar,.kitabi-hijri-top{background:#fff!important;border-bottom:1px solid #EAE2D3!important}
.qs-head,.qs-head *{color:#1E5631!important}
.actbar,.actbar *{color:#B0842C!important}
.actful .imgwrap{background:#F7F4ED!important}
.actful .miniblock>b{background:transparent!important}
h3,h4{border-bottom:2px solid #E7C98B!important;padding-bottom:7px!important;margin-bottom:11px!important}
.cover h3,.cover h4,.wa h3,.wa h4,.wa-head *,.central h4:only-child{border-bottom:0!important;padding-bottom:0!important}
.h,.story .h,.adab .h,.corner .h,.side-title,.qs-head,.actbar,.par .h,.refblock .h{border-bottom:2px solid #E7C98B!important;padding-bottom:7px!important;margin-bottom:9px!important}
.wa-head,.wa-head *{border-bottom:0!important;padding-bottom:0!important}
b.k{background:rgba(30,86,49,.10)!important;padding:2px 10px!important;border-radius:7px!important}
.qa .a{background:rgba(30,86,49,.10)!important;color:#15502F!important;padding:1px 9px!important;border-radius:6px!important}
.central>b{color:#1E5631!important}
.actgrid .t{display:inline-block!important;padding:3px 11px!important;border-radius:8px!important;margin-bottom:7px!important;font-weight:700!important;border-bottom:0!important}
.actgrid>div:nth-child(1) .t{background:rgba(30,86,49,.12)!important;color:#1E5631!important}
.actgrid>div:nth-child(2) .t{background:rgba(176,132,44,.17)!important;color:#8A5A12!important}
.actgrid>div:nth-child(3) .t{background:rgba(14,110,107,.14)!important;color:#0E6E6B!important}
.actgrid>div:nth-child(4) .t{background:rgba(122,92,192,.14)!important;color:#5A3F9A!important}
.dua{background:linear-gradient(150deg,#0F5747,#123f27)!important;border:1px solid rgba(214,154,51,.5)!important;text-align:center!important;box-shadow:0 16px 34px rgba(15,45,32,.28)!important;padding:22px!important;border-radius:16px!important}
.dua .seal{color:#D69A33;font-size:20px;margin-bottom:7px;letter-spacing:2px}
.dua .l{color:#E7C98B!important;font-family:var(--fd)!important;border-bottom:0!important;letter-spacing:1px}
.dua .x{font-family:'Amiri','Noto Naskh Arabic',serif!important;font-size:20px!important;line-height:2!important;color:#F6EFDD!important}
.hadith{background:#fff!important;box-shadow:none!important;font-family:'Amiri','Noto Naskh Arabic',serif!important;border:1px solid #EAE2D3!important}
.hadith::before{color:#8A6410!important;background:transparent!important;padding:0!important;font-family:var(--fd)!important;display:block;font-size:12px;font-weight:700;margin-bottom:6px;letter-spacing:.5px}
.hadith .ref{font-family:var(--fb)!important}
.acards-lead{background:#fff!important;border:1px solid #EAE2D3!important}
</style>
<style id="ghars-aux-identity">
/* Ghars identity for auxiliary sections (manzuma/arkan/portfolio/day) - ASCII only */
/* teacher notes -> white, ochre inline label */
.note{background:#fff!important;border:1px solid #EAE2D3!important;border-inline-start:1px solid #EAE2D3!important;color:#4b463d!important}
.note strong,.note b{color:#B07C22!important}
/* arkan: whiten tinted group/option boxes, drop colored top bars */
.lg{background:#fff!important;border:1px solid #EAE2D3!important;border-top:1px solid #EAE2D3!important}
.opt{background:#fff!important;border:1px solid #EAE2D3!important}
.opt.a{border-top:1px solid #EAE2D3!important}
.opt.b{border-top:1px solid #EAE2D3!important}
.opt .mean{background:#fff!important;border:1px solid #EAE2D3!important;color:#3a2f1a!important}
/* keep the a/b tag colored: it carries the corner distinction (label, not box fill) */
/* lesson header: replace gold side bar with clean start (title underline comes from box-identity h3/h4) */
.lesson-head{border-inline-start:0!important;padding-inline-start:0!important}

</head>
<body>
<div class="wrap">

  <!-- ===== الغلاف ===== -->
  <div class="cover">
    <div class="cover-bg"></div>
    <div class="cover-glow"></div>
    <div class="cover-in">
      <div class="cover-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4M12 2v2.6"/><path d="M7.6 7.6c0-1.5 2-2.6 4.4-2.6s4.4 1.1 4.4 2.6"/><rect x="7.1" y="7.6" width="9.8" height="9.4" rx="2.2"/><path d="M7.6 17c0 1.5 2 2.6 4.4 2.6s4.4-1.1 4.4-2.6"/><path d="M12 8.1v8.4M9.7 8.7v7.2M14.3 8.7v7.2"/><path d="M11 21.4h2"/></svg>
      </div>
      <div class="cover-txt">
        <span class="badge">منظومة الوحدة</span>
        <h1>منظومة <span>أحسن الأخلاق</span></h1>
        <div class="sub">منظومة وحدة المسكن — تغرس أحسن الأخلاق في وجدان الطفل بالإنشاد والترديد؛ يستمع إليها الأطفال ويردّدونها في ختام كل يوم.</div>
      </div>
    </div>
  </div>

  <!-- ===== شريط الاستخدام ===== -->
  <div class="usebar">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
    <div><b>ختام اليوم:</b> آخر نصف ساعة مخصّصة لمنظومة الوحدة — تُشغّلها المعلمة، ويستمع الأطفال ويردّدون، فترسخ معاني الوحدة بلطفٍ وتكرار.</div>
  </div>

  <!-- ===== الاستماع ===== -->
  <div class="card">
    <div class="sec-head">
      <div class="num"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l12 7-12 7z"/></svg></div>
      <h2>الاستماع إلى المنظومة</h2><div class="rule"></div>
    </div>
    <div class="media">
      <video controls preload="metadata" playsinline src="assets/gq_manzooma_akhlaq.mp4" style="object-fit:contain;background:#2c1a55">متصفحك لا يدعم تشغيل الفيديو.</video>
    </div>
    <div class="hint">📺 لتشغيلها على يوتيوب: <a href="https://www.youtube.com/watch?v=XdyoMAyYUB8" target="_blank" rel="noopener" style="color:var(--v2);font-weight:700;text-decoration:none">منظومة أحسن الأخلاق ↗</a></div>
  </div>

  <!-- ===== الأبيات ===== -->
  <div class="card">
    <div class="sec-head">
      <div class="num"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V6a2 2 0 0 1 2-2h9l3 3v13"/><path d="M9 9h7M9 13h7M9 17h4"/></svg></div>
      <h2>أبيات المنظومة</h2><div class="rule"></div>
    </div>
    <div style="text-align:center;color:var(--v2);font-family:var(--fd);font-size:14px;margin:-6px 0 4px">نظم: الشيخ عامر بهجت</div>
    <div class="poem">
      <div class="bayt"><span class="sadr">الحمدُ للهِ الذي قد وهَبا</span><span class="dot"></span><span class="ajz">عبادَه المقرَّبينَ الأدَبا</span></div>
      <div class="bayt"><span class="sadr">ثمَّ الصلاةُ بالسلامِ تلتقي</span><span class="dot"></span><span class="ajz">على نبيِّنا عظيمِ الخُلُقِ</span></div>
      <div class="bayt"><span class="sadr">وبعدُ: هاكَ أحسنَ الأخلاقِ</span><span class="dot"></span><span class="ajz">يرقى بها صاحبُها المراقي</span></div>
      <div class="bayt"><span class="sadr">فأوَّلًا: راعِ معَ اللهِ الأدبْ</span><span class="dot"></span><span class="ajz">بتركِ الإثمِ وبفعلِ ما وجبْ</span></div>
      <div class="bayt"><span class="sadr">وحُسنِ ظنٍّ وتوكُّلٍ رجا</span><span class="dot"></span><span class="ajz">حبٌّ وتوحيدٍ ومَن خافَ نجا</span></div>
      <div class="bayt"><span class="sadr">وقدِّمْ نبيَّه وعظِّمْ سُنَّتَهْ</span><span class="dot"></span><span class="ajz">قدِّمْ على كلِّ الورى محبَّتَهْ</span></div>
      <div class="bayt"><span class="sadr">وبَرَّ والدَيكَ ولْتُطِعْهُما</span><span class="dot"></span><span class="ajz">تفُزْ وصِلْ أيَّا بُنَيَّ الرَّحِما</span></div>
      <div class="bayt"><span class="sadr">بجِّلْ كبيرًا وارحمِ الصغيرا</span><span class="dot"></span><span class="ajz">وساعِدِ الضعيفَ والفقيرا</span></div>
      <div class="bayt"><span class="sadr">وكُنْ شجاعًا صابرًا كريما</span><span class="dot"></span><span class="ajz">وشاكرًا وفَطِنًا حليما</span></div>
      <div class="bayt"><span class="sadr">وذا أناةٍ وحياءٍ وارفُقِ</span><span class="dot"></span><span class="ajz">وكُنْ أمينًا وتواضعْ واصدُقِ</span></div>
      <div class="bayt"><span class="sadr">تحلَّ بالعدلِ وبالإحسانِ</span><span class="dot"></span><span class="ajz">والعفوِ والوفاءِ والإتقانِ</span></div>
      <div class="bayt"><span class="sadr">صُنِ اللسانَ واحفَظِ الجوارحا</span><span class="dot"></span><span class="ajz">أحبَّ كلَّ مسلمٍ كُنْ ناصحا</span></div>
      <div class="bayt"><span class="sadr">تقبَّلِ النُّصْحَ منَ الثِّقاتِ</span><span class="dot"></span><span class="ajz">وكُنْ محافظًا على الصلاةِ</span></div>
      <div class="bayt"><span class="sadr">وقتَكَ اشغَلْهُ بالانتفاعِ</span><span class="dot"></span><span class="ajz">والمالَ فاحفَظْهُ عنِ الضياعِ</span></div>
      <div class="bayt"><span class="sadr">بهمَّةٍ تعلَّمِ المفيدا</span><span class="dot"></span><span class="ajz">وطالِعِ الكُتْبَ تنَلْ مزيدا</span></div>
      <div class="bayt"><span class="sadr">واحترِمِ الكتابَ والمعلِّما</span><span class="dot"></span><span class="ajz">وأكرِمَنَّ ما استطعتَ العُلَما</span></div>
      <div class="bayt"><span class="sadr">أقبِلْ وأنصِتَنَّ للمحدِّثِ</span><span class="dot"></span><span class="ajz">وقدِّمِ الأكبرَ في التحدُّثِ</span></div>
      <div class="bayt"><span class="sadr">بالخيرِ فانطِقَنْ وإلّا فاصمُتِ</span><span class="dot"></span><span class="ajz">وقبلَ نقلِ خبرٍ تثبَّتِ</span></div>
      <div class="bayt"><span class="sadr">وقدِّمَنْ صلاةَ الاستخارهْ</span><span class="dot"></span><span class="ajz">إذا هممتَ ثمَّ الاستشارهْ</span></div>
      <div class="bayt"><span class="sadr">وأتبِعِ الخطأَ باعتذارِ</span><span class="dot"></span><span class="ajz">وأتبِعِ الذنبَ بالاستغفارِ</span></div>
      <div class="bayt"><span class="sadr">أفشِ السلامَ صاحِبِ الأخيارا</span><span class="dot"></span><span class="ajz">لا تُؤذِ إنسانًا أخُصُّ الجارا</span></div>
      <div class="bayt"><span class="sadr">وراعِ آدابَ بيوتِ الناسِ</span><span class="dot"></span><span class="ajz">كغضِّ طرفٍ وكالاستئناسِ</span></div>
      <div class="bayt"><span class="sadr">وأكرِمِ الضيفَ وكُنْ مُبتسِما</span><span class="dot"></span><span class="ajz">انصُرْ أخاكَ آثِرَنَّ المسلِما</span></div>
      <div class="bayt"><span class="sadr">عن كلِّ ما يسوءُ كُنْ عفيفا</span><span class="dot"></span><span class="ajz">حافِظْ على الصحّةِ كُنْ نظيفا</span></div>
      <div class="bayt"><span class="sadr">حافِظْ على الأذكارِ في الصباحِ</span><span class="dot"></span><span class="ajz">وفي المساءِ تحظَ بالفلاحِ</span></div>
      <div class="bayt"><span class="sadr">إذا عطستَ فاحمَدَنَّ اللهَ</span><span class="dot"></span><span class="ajz">وشمِّتَنْ مَن حمِدَ الإلها</span></div>
      <div class="bayt"><span class="sadr">على اليمينِ طاهرًا نمْ باكرا</span><span class="dot"></span><span class="ajz">ولْتكُنْ لأذكارِ المنامِ ذاكرا</span></div>
      <div class="bayt"><span class="sadr">مِمَّا يلي كُلْ باليمينِ سمِّ</span><span class="dot"></span><span class="ajz">في أوَّلٍ ثمَّ احمَدَنْ في الختمِ</span></div>
      <div class="bayt"><span class="sadr">أحمدُهُ -جلَّ- مصلِّيًا على</span><span class="dot"></span><span class="ajz">نبيِّنا يا ربِّ نظمي فاقبَلا</span></div>
    </div>
    <div class="poem-note">النصّ الكامل المعتمد: <a href="assets/gq_manzooma_akhlaq_nazm.pdf" target="_blank" rel="noopener" style="color:var(--v2);font-weight:700;text-decoration:none">ملف النظم (PDF) ↗</a> — تُنشَد في الفيديو أعلاه ويردّدها الأطفال في ختام اليوم.</div>
