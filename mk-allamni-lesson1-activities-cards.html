<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>بطاقات أنشطة المسكن — علّمني ربي</title>
<style>
@font-face{font-family:'AlAwwal';src:url('assets/fonts/AlAwwal-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'AlAwwal';src:url('assets/fonts/AlAwwal-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Saudi';src:url('assets/fonts/Saudi-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
:root{--fd:'AlAwwal','Noto Naskh Arabic',serif;--fb:'Saudi','Noto Naskh Arabic',Tahoma,sans-serif;--t1:#1F4A39;--elm:#0E6E6B;--gold:#C79A3B;--cream:#F6F1E6;--muted:#5f7168;--line:#d8cdb5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:#e7f0ee;padding:22px;color:#26332c;line-height:1.6}
.head{max-width:1000px;margin:0 auto 16px;text-align:center}.head h1{font-family:var(--fd);color:var(--t1);font-size:23px}.head p{color:var(--muted);font-size:13px;margin-top:5px}
.grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.dcard{background:var(--cream);border:2.5px solid var(--elm);border-radius:20px;padding:16px 14px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px;box-shadow:0 8px 20px rgba(15,60,55,.12);break-inside:avoid;justify-content:flex-start;position:relative}
.dcard .dc-brand{display:flex;align-items:center;gap:7px;position:absolute;top:12px;inset-inline-start:14px}
.dcard .dc-brand img{height:22px}.dcard .dc-brand b{font-family:var(--fd);color:var(--t1);font-size:10px}
.dcard .dc-top{font-family:var(--fd);color:var(--gold);font-size:13px;margin-top:8px}
.dcard .dc-img{width:100%;max-width:300px;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 3px 10px rgba(20,50,35,.08)}
.dcard .dc-img img{width:100%;height:100%;object-fit:cover;display:block}
.dcard .dc-text{font-family:var(--fd);font-weight:700;color:var(--t1);font-size:34px;line-height:1.2}
.printbtn{display:block;margin:22px auto 6px;background:var(--elm);color:#fff;border:0;border-radius:999px;padding:11px 28px;font-family:var(--fb);font-weight:700;font-size:14px;cursor:pointer}
@media print{@page{size:A4 portrait;margin:10mm}body{background:#fff;padding:0}.head p,.printbtn{display:none}.grid{gap:8mm}.dcard{box-shadow:none}.dcard .dc-img{box-shadow:none}.dcard .dc-text{font-size:36px}}
</style></head><body>
<div class="head"><h1>بطاقات أنشطة المسكن</h1><p>علّمني ربي · المسكن · اللقاء الأول · اطبعيها وقُصّيها؛ يختار الطفل بطاقةً ويعبّر عمّا يفعله في مسكنه</p></div>
<div class="grid">
  <div class="dcard"><div class="dc-brand"><img src="brand/logo-ghars.webp" alt="غرس"/><b>علّمني ربي</b></div><span class="dc-top">في مسكني</span><div class="dc-img"><img src="assets/cards/mk-act-eat.jpg" alt="نأكل"/></div><span class="dc-text">نأكل</span></div>
  <div class="dcard"><div class="dc-brand"><img src="brand/logo-ghars.webp" alt="غرس"/><b>علّمني ربي</b></div><span class="dc-top">في مسكني</span><div class="dc-img"><img src="assets/cards/mk-act-sleep.jpg" alt="ننام"/></div><span class="dc-text">ننام</span></div>
  <div class="dcard"><div class="dc-brand"><img src="brand/logo-ghars.webp" alt="غرس"/><b>علّمني ربي</b></div><span class="dc-top">في مسكني</span><div class="dc-img"><img src="assets/cards/mk-act-pray.jpg" alt="نصلّي"/></div><span class="dc-text">نصلّي</span></div>
  <div class="dcard"><div class="dc-brand"><img src="brand/logo-ghars.webp" alt="غرس"/><b>علّمني ربي</b></div><span class="dc-top">في مسكني</span><div class="dc-img"><img src="assets/cards/mk-act-read.jpg" alt="نقرأ"/></div><span class="dc-text">نقرأ</span></div>
  <div class="dcard"><div class="dc-brand"><img src="brand/logo-ghars.webp" alt="غرس"/><b>علّمني ربي</b></div><span class="dc-top">في مسكني</span><div class="dc-img"><img src="assets/cards/mk-act-play.jpg" alt="نلعب"/></div><span class="dc-text">نلعب</span></div>
</div>
<button class="printbtn" onclick="window.print()">🖨️ طباعة البطاقات</button>
</body></html>
