<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Amiri','Noto Naskh Arabic','Traditional Arabic',serif" direction="rtl">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7EC"/><stop offset="1" stop-color="#F2EAD6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9B24A"/><stop offset="0.5" stop-color="#C79A3B"/><stop offset="1" stop-color="#A87A24"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/><stop offset="1" stop-color="#111"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect x="26" y="26" width="748" height="548" rx="30" fill="none" stroke="#2C6A4D" stroke-width="6"/>
  <rect x="42" y="42" width="716" height="516" rx="22" fill="none" stroke="#C79A3B" stroke-width="2" stroke-dasharray="3 9"/>
  <!-- eyebrow -->
  <text x="400" y="150" text-anchor="middle" font-size="34" fill="#2C6A4D">اسْمٌ مِنْ أَسْمَاءِ اللهِ الحُسْنَى</text>
  <!-- the name -->
  <text x="400" y="345" text-anchor="middle" font-size="150" font-weight="700" fill="url(#gold)">الْهَادِي</text>
  <!-- meaning -->
  <text x="400" y="450" text-anchor="middle" font-size="30" fill="#4a5a50">الَّذِي يَهْدِي عِبَادَهُ إِلَى الخَيْرِ وَالحَقِّ</text>
  <!-- small seedling accent -->
  <circle cx="400" cy="512" r="7" fill="#2C6A4D"/>
  <path d="M400 512 q-26 -20 -46 -12 q14 22 46 12 z" fill="#3f8f5f"/>
  <path d="M400 512 q26 -20 46 -12 q-14 22 -46 12 z" fill="#57a877"/>
  <!-- "black paper reveal" motif: a peeling black corner top-right -->
  <path d="M560 26 L774 26 L774 250 Q690 210 640 150 Q600 95 560 26 Z" fill="url(#black)" opacity="0.92"/>
  <path d="M560 26 Q602 96 641 150 Q690 210 774 250 L774 250 Q660 205 604 120 Q574 74 560 26 Z" fill="#000" opacity="0.25"/>
  <text x="690" y="120" text-anchor="middle" font-size="26" fill="#EFE7D5" transform="rotate(28 690 120)">اكشِفْ</text>
</svg>
